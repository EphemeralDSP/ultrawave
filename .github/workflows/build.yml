name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            runner: ephemeral-runners
          - os: macos-latest
            runner: macos-latest
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust environment (ephemeral runners)
        if: matrix.runner == 'ephemeral-runners'
        run: |
          echo "RUSTUP_HOME=$HOME/.rustup" >> $GITHUB_ENV
          echo "CARGO_HOME=$HOME/.cargo" >> $GITHUB_ENV
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxcb1-dev libxcb-icccm4-dev libxcb-image0-dev libxcb-keysyms1-dev libxcb-render-util0-dev libxcb-xkb-dev libxkbcommon-x11-dev libxkbcommon-dev libasound2-dev libxcursor-dev libx11-dev libx11-xcb-dev libjack-dev libxcb-dri2-0-dev libfontconfig1-dev

      - name: Build
        run: cargo build --release

      - name: Test
        run: cargo test

      - name: Bundle plugins
        run: cargo xtask bundle ultrawave --release

      - name: Validate CLAP plugin (Linux)
        if: runner.os == 'Linux'
        run: |
          wget -q https://github.com/free-audio/clap-validator/releases/download/0.3.2/clap-validator-0.3.2-ubuntu-18.04.tar.gz
          tar -xzf clap-validator-0.3.2-ubuntu-18.04.tar.gz
          ./clap-validator validate target/bundled/ultrawave.clap || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ultrawave-${{ matrix.os }}
          path: target/bundled/
