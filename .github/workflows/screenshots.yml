name: GUI Screenshots

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Plugin to screenshot'
        required: false
        default: 'both'
        type: choice
        options:
          - both
          - record
          - play

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb imagemagick libasound2-dev libgl1-mesa-dev libx11-xcb-dev libxcb1-dev libxcb-dri2-0-dev libxcb-icccm4-dev libxcb-keysyms1-dev libxcb-randr0-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb-xkb-dev libxkbcommon-dev libxkbcommon-x11-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build plugins
        run: |
          cargo build --release
          cargo xtask bundle ultrawave_record --release
          cargo xtask bundle ultrawave_play --release

      - name: Capture screenshots
        run: |
          chmod +x scripts/screenshot.sh
          ./scripts/screenshot.sh ${{ inputs.target || 'both' }}

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: gui-screenshots
          path: screenshots/*.png
          retention-days: 30
