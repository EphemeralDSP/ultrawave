[package]
name = "ultrawave"
version = "0.1.0"
edition = "2021"
authors = ["EphemeralDSP"]
license = "MIT"
description = "Elektron Machinedrum UW RAM machine emulation - Core library"

[lib]
name = "ultrawave"
crate-type = ["lib"]

[[bin]]
name = "ultrawave_record"
path = "src/bin/record.rs"

[[bin]]
name = "ultrawave_play"
path = "src/bin/play.rs"

[dependencies]
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", features = ["standalone"] }
nih_plug_vizia = { git = "https://github.com/robbert-vdh/nih-plug.git" }
libc = "0.2"
ephemeral-dsp = { git = "ssh://git@github.com/EphemeralDSP/ephemeral.git", rev = "243d21b7aef5337ea8ff0e30750c01d1fa3af296" }

# DSP
rubato = "1.0"
biquad = "0.4"
hound = "3.5"
dasp_sample = "0.11"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Memory"] }

[dev-dependencies]
audio-processor-testing-helpers = "2.7"
approx = "0.5"

[profile.release]
lto = "thin"
strip = "symbols"

[workspace]
members = ["xtask", "plugins/ultrawave_record", "plugins/ultrawave_play"]

# Patch baseview to fix null pointer dereference in become_first_responder on macOS.
# The vendored copy adds a nil check for [this window] before calling [window isKeyWindow].
[patch.'https://github.com/RustAudio/baseview.git']
baseview = { path = "vendor/baseview" }
