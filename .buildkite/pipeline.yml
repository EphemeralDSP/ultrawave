env:
  CARGO_TERM_COLOR: "always"
  RUSTUP_TOOLCHAIN: "1.95.0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_INCREMENTAL: "0"

# The hosted pipeline only loads this file. No step installs tools or publishes.
# Provision native toolchains/validators on agents before selecting their target.
steps:
  - group: "Native candidates (manual)"
    if: >-
      (build.source == "ui" || build.source == "api") &&
      build.env("ULTRAWAVE_VALIDATE") == "1"
    steps:
      - label: ":linux: Linux x86-64"
        key: "native-linux"
        if: build.env("ULTRAWAVE_PLATFORM") == "linux-x86_64" || build.env("ULTRAWAVE_PLATFORM") == "all"
        agents:
          queue: "juce-build"
          os: "linux"
        concurrency: 1
        concurrency_group: "ultrawave-native-linux"
        timeout_in_minutes: 60
        command: "python3 ci/buildkite.py"

      - label: ":mac: macOS arm64"
        key: "native-macos"
        if: build.env("ULTRAWAVE_PLATFORM") == "macos-arm64" || build.env("ULTRAWAVE_PLATFORM") == "all"
        agents:
          queue: "juce-build"
          os: "macos"
          arch: "arm64"
        concurrency: 1
        concurrency_group: "ultrawave-native-macos"
        timeout_in_minutes: 60
        command: "/usr/bin/caffeinate -is /opt/homebrew/bin/python3 ci/buildkite.py"

      - label: ":windows: Windows x86-64"
        key: "native-windows"
        if: build.env("ULTRAWAVE_PLATFORM") == "windows-x86_64" || build.env("ULTRAWAVE_PLATFORM") == "all"
        agents:
          queue: "juce-build"
          os: "windows"
        concurrency: 1
        concurrency_group: "ultrawave-native-windows"
        timeout_in_minutes: 60
        command: "py -3.12 ci/buildkite.py"
