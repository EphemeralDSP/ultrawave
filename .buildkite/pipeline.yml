env:
  CARGO_TERM_COLOR: "always"

# Optional self-hosted validation only. Release builds/publication are explicit
# local commands in ci/release.py; neither a main push nor a tag runs this file.
steps:
  - label: ":linux: Validate (manual)"
    if: build.env("ULTRAWAVE_VALIDATE") == "1"
    agents:
      queue: "juce-build"
      os: "linux"
    env:
      VALIDATION_STRICTNESS: "5"
    commands:
      - "bash ci/scripts/deps-linux.sh"
      - "bash ci/scripts/build.sh"
      - "bash ci/scripts/test.sh"
      - "bash ci/scripts/bundle.sh"
      - "bash ci/scripts/validate.sh"

  - label: ":mac: Validate (manual)"
    if: build.env("ULTRAWAVE_VALIDATE") == "1"
    agents:
      queue: "juce-build"
      os: "macos"
    env:
      PATH: "/Users/jeff/.cargo/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
      CARGO: "/Users/jeff/.cargo/bin/cargo"
      VALIDATION_STRICTNESS: "5"
    commands:
      - "bash ci/scripts/deps-macos.sh"
      - "bash ci/scripts/build.sh"
      - "bash ci/scripts/test.sh"
      - "bash ci/scripts/bundle.sh"
      - "bash ci/scripts/validate.sh"
